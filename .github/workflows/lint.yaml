name: lint
on: [push, pull_request]
# on:
#   push:
#     branches:
#     - git-action
#     - master
#     - release-*
#   pull_request:
#     branches:
#     - git-action
#     - master
#     - release-*

jobs:
  go_linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v2
        with:
          go-version: 1.17.x
      - name: Install Go dependencies
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go go-install
      - name: Format Go code
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go fmt
      - name: go vet
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go vet
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-go@v2
        with:
          go-version: 1.17.x
      - name: eslint
        run: |
          go run build.go web-lint
